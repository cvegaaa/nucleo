services:
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nucleo
      MINIO_ROOT_PASSWORD: nucleo_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nucleo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  nucleo_minio_data:
